# Spack environment file to build UPP dependencies
spack:
  packages:
    all:
      compiler:
      - intel
      - gcc@10:10
  specs:
  - netcdf-c@4.9.2
  - netcdf-fortran@4.6.1
  - bacio@2.6.0
  - w3emc@2.13.0
  - g2@3.5.1
  - g2tmpl@1.17.0
  - ip@5.4.0
  - sigio@2.3.3
  - nemsio@2.5.5
  - wrf-io@1.3.0
  - crtm@3.1.3
  view: true
  concretizer:
    unify: true

